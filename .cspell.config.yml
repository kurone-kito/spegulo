cache:
  cacheFormat: universal
  cacheLocation: node_modules/.cache/cspell/.cspell.cache
  cacheStrategy: metadata
  useCache: true
import:
  - '@kurone-kito/cspell-config'
version: '0.2'
words:
  # This project
  - spegulo
  # Vocabulary used by docs/deployment-options.md (GPU passthrough
  # terminology)
  - CUDA
  - IOMMU
  - VFIO
  # Vocabulary used by the imported IDD docs and instruction bundle
  - dedup
  - deprioritize
  - desync
  - desynced
  - Esync
  - isort
  - ONNX
  - pylint
  - pyproject
  - pytest
  - qwen
  - TOCTOU
  - undispositioned
  - unioned
  - unpushed
  - unreplied
  - unscored
  - unwaived
  - waivable
