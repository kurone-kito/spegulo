name: Strip untrusted reserved IDD labels
on:
  issues:
    types:
      - labeled
  pull_request_target:
    types:
      - labeled
permissions:
  issues: write
  pull-requests: write
concurrency:
  group: strip-untrusted-labels-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true
jobs:
  strip-label:
    # Reserved set: the three policy-decision label names this repository
    # configures, plus the authoring hold label. A spurious `roadmap` makes
    # Discover read an ordinary execution issue as a coordination node; a
    # spurious `status:needs-decision`, `status:blocked-by-human`, or
    # `status:authoring` drops it from the candidate set. Both fail silently.
    #
    # `coderabbitai[bot]` was observed applying `roadmap` to four ordinary
    # child issues within a minute of their creation on 2026-08-07, which is
    # why this guard ships enabled rather than as a precaution.
    if: |-
      contains(fromJSON('["coderabbitai[bot]"]'), github.event.sender.login) && (github.event.label.name == 'roadmap' || github.event.label.name == 'status:blocked-by-human' || github.event.label.name == 'status:needs-decision' || github.event.label.name == 'status:authoring')
    # ubuntu-latest rather than this repository's usual ubuntu-slim: the
    # upstream recipe ships ubuntu-latest for portability, and the leaner
    # image's toolchain has not been verified against this job's `gh` CLI
    # call. See https://github.com/actions/runner-images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove reserved label applied by an untrusted labeler
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request_target" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL_NAME"
          else
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label "$LABEL_NAME"
          fi
